<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boosters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    /* pack cards */
    #booster > div {
      width: 400px;
      height: 400px;
      border-radius: 10px;
      margin-top: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: solid black;
    }
    img { width: 150px; height: 100px; }
    button { border: solid black; background-color: black; border-radius: 10px; }

    /* basket items */
    #basket li {
      margin: auto;
      background-color: rgba(92, 94, 26, 0.5);
      width: 400px;
      height: 400px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: solid black;
      text-align: center;
    }
  </style>
</head>
<body style="background-image: url(./ressource/bg.png); background-repeat: no-repeat; background-size: cover; min-height: 1400px;">
  <header>
    <nav class="backdrop-blur-md border-b border-cyan-500/40 px-3 py-4 flex justify-between items-center shadow-2xl">
      <img src="./ressource/logo.png" class="w-80 h-40">
      <ul class="flex gap-20 text-xl font-['Cinzel_Decorative'] text-5xl font-black text-amber-400 tracking-widest drop-shadow-[0_0_12px_rgba(251,191,36,0.5)]">
        <li><a href="./main.html">Accuiel</a></li>
        <li><a>Cards</a></li>
        <li><a>Collection</a></li>
        <li><a href="./shop.html">Shop</a></li>
        <li><a href="./boosters.html">Boosters</a></li>
      </ul>
    </nav>
  </header>

  <!-- Packs -->
  <main id="booster" class="grid grid-cols-1 justify-center content-center gap-20 border-cyan-500 text-center md:grid-cols-2 lg:grid-cols-4">
    <div style="background: rgba(95, 108, 77, 0.682)">
      <span class="font-['Cinzel_Decorative'] text-3xl">LEGENDARY PACK</span>
      <button class="font-['Cinzel_Decorative'] text-3xl" id="legendary">PICK</button>
    </div>
    <div style="background: rgba(195, 195, 204, 0.5)">
      <span class="font-['Cinzel_Decorative'] text-3xl">EPIC PACK</span>
      <button class="font-['Cinzel_Decorative'] text-3xl" id="epic">PICK</button>
    </div>
    <div style="background: rgba(92, 94, 26, 0.5)">
      <span class="font-['Cinzel_Decorative'] text-3xl">BRONZE PACK</span>
      <button class="font-['Cinzel_Decorative'] text-3xl" id="bronze">PICK</button>
    </div>
    <div style="background-color: rgba(22, 22, 173, 0.322);">
      <span class="font-['Cinzel_Decorative'] text-3xl">SPELLS PACK</span>
      <button class="font-['Cinzel_Decorative'] text-3xl" id="spells">PICK</button>
    </div>
  </main>

  <!-- Basket (same page, so #basket is never null) -->
  <section class="justify-center content-center mt-24">
    <h2 class="text-center font-['Cinzel_Decorative'] text-4xl text-amber-400 mb-10">BASKET</h2>
    <ul id="basket" class="grid grid-cols-3 gap-20 justify-center content-center items-center"></ul>
  </section>

  <script type="module" src="./script.js"></script>
</body>
</html>
