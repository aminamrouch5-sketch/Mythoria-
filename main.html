<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste de tâches</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Ma liste de tâches</h1>
  <form id="form-tache" novalidate>
    <input type="text" id="titre" placeholder="Titre de la tâche">
    <input type="datetime-local" id="echeance">
    <button type="submit">Ajouter</button>
  </form>
  <p id="erreur"></p>
  <div id="filtres">
    <button type="button" data-filtre="toutes" class="actif">Toutes</button>
    <button type="button" data-filtre="avenir">À venir</button>
    <button type="button" data-filtre="passees">Passées</button>
  </div>
  <ul id="liste-taches"></ul>
</body>
</html>
